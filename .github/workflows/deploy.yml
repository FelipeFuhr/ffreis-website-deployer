name: Deploy

permissions: {}

on:
  repository_dispatch:
    types: [website-deploy-request]
  workflow_dispatch:
    inputs:
      website_name:
        description: 'Website name (must match a file in websites-inventory/)'
        required: true
      deployment_name:
        description: 'Deployment to run (empty = all deployments)'
        required: false
        default: ''
      website_sha:
        description: 'Website repo SHA (leave empty for HEAD of main)'
        required: false
        default: ''
      data_sha:
        description: 'Data repo SHA (leave empty for HEAD of main)'
        required: false
        default: ''

# Never cancel a running deploy mid-flight. Queue the next one instead.
concurrency:
  group: deploy-${{ inputs.website_name || github.event.client_payload.website_name }}-${{ inputs.deployment_name || github.event.client_payload.deployment_name || 'all' }}
  cancel-in-progress: false

jobs:
  # ── config ────────────────────────────────────────────────────────────────
  # Reads <website_name>.yaml from websites-inventory and resolves the list of
  # deployments to build. Downstream jobs fan out over deployments_json as a matrix.
  config:
    timeout-minutes: 30
    name: Resolve Config
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    outputs:
      website_name:     ${{ steps.name.outputs.website_name }}
      should_deploy:    ${{ steps.parse.outputs.should_deploy }}
      deployments_json: ${{ steps.parse.outputs.deployments_json }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ !env.ACT }} # harden-runner can't run under act/podman; runs on real GitHub only
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Resolve website name
        id: name
        run: |
          NAME="${{ inputs.website_name || github.event.client_payload.website_name }}"
          if [[ -z "$NAME" ]]; then
            echo "website_name is required (pass as input or client_payload.website_name)" >&2
            exit 1
          fi
          echo "website_name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout websites-inventory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ vars.INVENTORY_REPO || format('{0}/websites-inventory', github.repository_owner) }}
          token: ${{ startsWith(vars.INVENTORY_REPO || format('{0}/websites-inventory', github.repository_owner), 'ffreis-org/') && secrets.FLEET_READ_TOKEN_ORG || secrets.FLEET_READ_TOKEN_FFREIS }}

      - name: Parse inventory and resolve deployments
        id: parse
        env:
          WEBSITE_NAME:      ${{ steps.name.outputs.website_name }}
          DEPLOYMENT_NAME:   ${{ inputs.deployment_name || github.event.client_payload.deployment_name || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import yaml, os, sys, json, glob

          name              = os.environ["WEBSITE_NAME"]
          deployment_filter = os.environ.get("DEPLOYMENT_NAME", "").strip()
          event             = os.environ["GITHUB_EVENT_NAME"]

          matches = glob.glob(f"**/{name}.yaml", recursive=True)
          if not matches:
              print(f"Inventory file not found: {name}.yaml (searched recursively)", file=sys.stderr)
              sys.exit(1)
          path = matches[0]
          with open(path) as f:
              cfg = yaml.safe_load(f)

          top_sources   = cfg.get("sources", {})
          top_website   = top_sources.get("website", {})
          top_data      = top_sources.get("data",    {})
          top_posts     = top_sources.get("posts",   {})
          top_projects  = top_sources.get("projects", {})
          top_courses   = top_sources.get("courses",  {})
          top_compiler  = cfg.get("compiler", {})
          top_builds    = cfg.get("builds",  {})
          top_publish   = cfg.get("publish", {})
          top_mode      = cfg.get("deploy_mode", "manual")
          top_env       = cfg.get("github_environment", "prod")
          top_cf        = top_publish.get("cloudfront_invalidate_paths", ["/*"])
          top_recaptcha = cfg.get("recaptcha_site_key", "")
          top_tracker   = cfg.get("tracker", {})
          top_content_source = cfg.get("content_source", "prod")

          # Anti-leak guard: content_source=mock is only allowed for dev environments.
          # This prevents an accidental prod inventory from baking in mock content.
          if top_content_source == "mock" and not top_env.endswith("-dev"):
              print(
                  f"FATAL: content_source=mock is set in {path} but "
                  f"github_environment={top_env!r} is not a dev environment. "
                  "Mock content must never reach production.",
                  file=sys.stderr,
              )
              sys.exit(1)

          raw_deployments = cfg.get("deployments", None)
          legacy = raw_deployments is None

          def resolve(dep_name, dep_cfg):
              d_src = dep_cfg.get("sources", {})
              d_web = d_src.get("website", {})
              d_dat = d_src.get("data",    {})
              d_pos = d_src.get("posts",   {})
              d_prj = d_src.get("projects", {})
              d_crs = d_src.get("courses",  {})
              d_pub = dep_cfg.get("publish", {})
              d_cf  = d_pub.get("cloudfront_invalidate_paths", top_cf)
              prefix = d_pub.get("prefix", "")
              # A prefixed deployment publishes NOTHING to the bucket root, so
              # the historical ["/"] default aimed the post-deploy check at a
              # path this deployment does not maintain — on forma-dev that meant
              # every `en`/`pt` deploy was gated on 60 root objects frozen since
              # 2026-10-12. The default must derive from the prefix.
              #
              # `/{prefix}index.html`, not `/{prefix}/`: CloudFront's
              # DefaultRootObject applies ONLY to the distribution root, so
              # `/en/` has no guaranteed mapping to `en/index.html` unless the
              # site also runs a directory-index function. The explicit key is
              # the one URL that is certain to exist for every archetype,
              # clean-URL or flat-.html.
              default_smoke = [f"/{prefix.strip('/')}/index.html"] if prefix else ["/"]
              return {
                  "name":             dep_name,
                  "deploy_mode":      dep_cfg.get("deploy_mode", top_mode),
                  "website_repo":     top_website.get("repo", ""),
                  "website_ref":      d_web.get("ref", top_website.get("ref", "main")),
                  "data_repo":        top_data.get("repo", ""),
                  "data_ref":         d_dat.get("ref", top_data.get("ref", "main")),
                  "data_subpath":     d_dat.get("subpath", top_data.get("subpath", "")),
                  "posts_repo":       d_pos.get("repo", top_posts.get("repo", "")),
                  "posts_ref":        d_pos.get("ref",  top_posts.get("ref",  "main")),
                  "projects_repo":    d_prj.get("repo", top_projects.get("repo", "")),
                  "projects_ref":     d_prj.get("ref",  top_projects.get("ref",  "main")),
                  "courses_repo":     d_crs.get("repo", top_courses.get("repo", "")),
                  "courses_ref":      d_crs.get("ref",  top_courses.get("ref",  "main")),
                  # Compiler-native single-repo sites (ffreis-urbs, ffreis-koe-website)
                  # keep their page copy in their OWN per-language data layer instead
                  # of a separate *-data repo, and must be built with an explicit
                  # -site-data "<common>|<i18n>/<lang>". Empty for the split
                  # template+data archetype, which injects data into src/data/ instead.
                  "site_data_common": top_website.get("site_data", {}).get("common", ""),
                  "site_data_i18n":   top_website.get("site_data", {}).get("i18n", ""),
                  "compiler_repo":    top_compiler.get("repo", ""),
                  "compiler_ref":     top_compiler.get("ref", "main"),
                  # Every existing site's templates assume clean URLs (the historical,
                  # unconditional default), so this only turns OFF -clean-urls, and only
                  # when a site's own templates use flat .html-style hrefs instead (e.g.
                  # forma-dev — see its inventory entry for why).
                  "compiler_clean_urls": "" if top_compiler.get("clean_urls", True) is False else "true",
                  "compiler_js_inline_threshold":        str(top_compiler["js_inline_threshold"]) if "js_inline_threshold" in top_compiler else "",
                  "compiler_js_shared_inline_threshold": str(top_compiler["js_shared_inline_threshold"]) if "js_shared_inline_threshold" in top_compiler else "",
                  "compiler_raster_inline_threshold":    str(top_compiler["raster_inline_threshold"]) if "raster_inline_threshold" in top_compiler else "",
                  "compiler_embed_fonts":                "true" if top_compiler.get("embed_fonts", False) else "",
                  "compiler_inline_body_css":            "true" if top_compiler.get("inline_body_css", False) else "",
                  "compiler_allow_blanket_robots_disallow": "true" if top_compiler.get("allow_blanket_robots_disallow", False) else "",
                  # Site-level list of sections to hide (blog/courses/projects); prod sets it, dev omits.
                  "disable_sections":                    ",".join(cfg.get("disable_sections", [])),
                  "builds_bucket":    top_builds.get("bucket", ""),
                  "builds_region":    top_builds.get("region", "us-east-1"),
                  "publish_bucket":   d_pub.get("bucket", top_publish.get("bucket", "")),
                  "publish_prefix":   prefix,
                  "publish_region":   d_pub.get("region", top_publish.get("region", top_builds.get("region", "us-east-1"))),
                  "cloudfront_paths": " ".join(d_cf),
                  "github_env":       dep_cfg.get("github_environment", top_env),
                  "staging_prefix":   f"{name}/{dep_name}" if not legacy else name,
                  "smoke_paths":      " ".join(dep_cfg.get("smoke_paths", top_publish.get("smoke_paths", default_smoke))),
                  # IP-restricted sites (WAF-allowlist on prod, not just dev) need to skip
                  # smoke since GH runner IPs aren't in the allowlist. Set in inventory at
                  # publish.skip_smoke: true (or per-deployment override).
                  "skip_smoke":       "true" if dep_cfg.get("skip_smoke", top_publish.get("skip_smoke", False)) else "",
                  # Emit a per-language content bundle for native mobile apps (petlook-mobile).
                  # When true the build step runs emit-content-bundle and the output rides the
                  # existing S3 sync under dist/content-bundle/. Top-level only; not per-deployment.
                  "emit_content_bundle": "true" if cfg.get("emit_content_bundle", False) else "",
                  # Shared JS package injected into the site's src/assets/js/ before compilation.
                  # Set sources.shared_js: {repo: ..., ref: ...} in the inventory YAML.
                  "shared_js_repo": top_sources.get("shared_js", {}).get("repo", ""),
                  "shared_js_ref":  top_sources.get("shared_js", {}).get("ref",  "main"),
                  # Optional allow-list of shared *.js filenames to inject.
                  # Empty = every *.js in the shared repo, which is the
                  # historical behaviour and stays the default.
                  "shared_js_files": " ".join(top_sources.get("shared_js", {}).get("files", [])),
                  # ffreis-tracker-sdk injection. Set tracker: {enabled, sdk_version, site_id,
                  # endpoint, cdn_base} in the inventory YAML. All values are top-level only
                  # (not per-deployment) — the same SDK version and endpoint serve all langs.
                  "tracker_enabled":     "true" if top_tracker.get("enabled", False) else "",
                  "tracker_sdk_version": top_tracker.get("sdk_version", ""),
                  "tracker_site_id":     top_tracker.get("site_id", ""),
                  "tracker_endpoint":    top_tracker.get("endpoint", ""),
                  "tracker_cdn_base":    top_tracker.get("cdn_base", ""),
                  # content_source controls which subdirectory of each content repo
                  # the build step reads. "mock" → mock/ subdirs + --content-source mock
                  # compiler flag. "prod" (default) → top-level paths + no flag.
                  "content_source":      top_content_source,
              }

          if not legacy:
              all_deps = [resolve(k, v) for k, v in raw_deployments.items()]
          else:
              all_deps = [resolve("production", {})]

          # Compute sibling_prefixes for each deployment: the non-empty prefixes
          # of all other deployments sharing the same publish bucket. Used by the
          # promote step to add --exclude patterns so a root-prefix deploy (PT)
          # does not delete sub-prefix content (EN, dev, etc.).
          all_buckets_prefixes = [(d["publish_bucket"], d["publish_prefix"]) for d in all_deps]
          for d in all_deps:
              siblings = [
                  p for (b, p) in all_buckets_prefixes
                  if b == d["publish_bucket"] and p and p != d["publish_prefix"]
              ]
              d["sibling_prefixes"] = " ".join(siblings)

          # For the promote job's orphan scan: the FULL set of prefixes declared
          # for this deployment's publish bucket (its own included), and whether
          # any deployment claims the bucket ROOT. Anything outside that set is
          # maintained by no deployment — never synced, never invalidated — so it
          # serves its current bytes indefinitely.
          #
          # Derived from all_deps, not from `selected` below: a single-deployment
          # dispatch must still see its siblings' prefixes, or every key the
          # other languages maintain would look like an orphan.
          for d in all_deps:
              d["managed_prefixes"] = " ".join(sorted({
                  p for (b, p) in all_buckets_prefixes
                  if b == d["publish_bucket"] and p
              }))
              d["root_is_managed"] = "true" if any(
                  b == d["publish_bucket"] and not p for (b, p) in all_buckets_prefixes
              ) else ""

          if deployment_filter:
              selected = [d for d in all_deps if d["name"] == deployment_filter]
              if not selected:
                  avail = [d["name"] for d in all_deps]
                  print(f"deployment '{deployment_filter}' not found in {path}; available: {avail}", file=sys.stderr)
                  sys.exit(1)
          elif event == "workflow_dispatch":
              selected = all_deps
          else:
              selected = [d for d in all_deps if d["deploy_mode"] == "auto"]

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              delim = "DEPLOYMENTS_JSON_EOF"
              f.write(f"should_deploy={'true' if selected else 'false'}\n")
              f.write(f"deployments_json<<{delim}\n")
              f.write(json.dumps(selected))
              f.write(f"\n{delim}\n")
          PYEOF

  # ── validate ──────────────────────────────────────────────────────────────
  validate:
    timeout-minutes: 30
    name: Validate Data (${{ matrix.deployment.name }})
    needs: config
    if: needs.config.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJson(needs.config.outputs.deployments_json) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ !env.ACT }} # harden-runner can't run under act/podman; runs on real GitHub only
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout data repo
        if: matrix.deployment.data_repo != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.deployment.data_repo }}
          ref: ${{ github.event.client_payload.data_sha || inputs.data_sha || matrix.deployment.data_ref }}
          path: checkout/data
          token: ${{ startsWith(matrix.deployment.data_repo, 'ffreis-org/') && secrets.FLEET_READ_TOKEN_ORG || secrets.FLEET_READ_TOKEN_FFREIS }}

      - name: Checkout website repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.deployment.website_repo }}
          ref: ${{ inputs.website_sha || matrix.deployment.website_ref }}
          path: checkout/website
          token: ${{ startsWith(matrix.deployment.website_repo, 'ffreis-org/') && secrets.FLEET_READ_TOKEN_ORG || secrets.FLEET_READ_TOKEN_FFREIS }}

      - name: Checkout compiler
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.deployment.compiler_repo }}
          ref: ${{ matrix.deployment.compiler_ref }}
          path: checkout/compiler
          token: ${{ startsWith(matrix.deployment.compiler_repo, 'ffreis-org/') && secrets.FLEET_READ_TOKEN_ORG || secrets.FLEET_READ_TOKEN_FFREIS }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: checkout/compiler/go.mod
          cache: true

      - name: Detect compiler layout
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          for root in checkout/compiler checkout/compiler/*/; do
            if [[ -f "${root}/go.mod" && -f "${root}/cmd/website-compiler/main.go" ]]; then
              echo "dir=${root}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Could not detect compiler layout under checkout/compiler" >&2; exit 1

      - name: Inject data into website
        if: matrix.deployment.data_repo != ''
        run: |
          set -euo pipefail
          SUBPATH="${{ matrix.deployment.data_subpath }}"
          SD_I18N="${{ matrix.deployment.site_data_i18n }}"
          if [[ -n "$SD_I18N" ]]; then
            # Compiler-native LAYERED archetype (ffreis-urbs). The data repo
            # carries the per-language layer tree itself -- i18n/<lang>/*.yaml,
            # with no site.d/ and no site.yaml -- and the website repo keeps the
            # common layer. So the injection is a directory swap, not a merge:
            # replace the website's layer dir wholesale, which is also what
            # makes a file DELETED in the data repo actually disappear from the
            # build instead of surviving as a stale copy.
            SRC="checkout/data${SUBPATH:+/${SUBPATH%/}}"
            DEST="checkout/website/${SD_I18N%/}"
            if [[ ! -d "$SRC" ]]; then
              echo "site_data.i18n is set, so the data repo must carry the language layers at '${SUBPATH:-<repo root>}' -- not found" >&2
              exit 1
            fi
            rm -rf "$DEST"
            mkdir -p "$(dirname "$DEST")"
            cp -r "$SRC" "$DEST"
          else
            # Split template+data archetype: the data repo carries site.d/ +
            # site.yaml, which are merged into the website's own src/data/.
            DATA_ROOT="checkout/data${SUBPATH:+/${SUBPATH%/}}"
            # shared/ lives alongside the language dirs; derive its parent from DATA_ROOT.
            # Works whether subpath is "en/" (root layout) or "data/en/" (nested layout).
            if [[ -n "$SUBPATH" ]]; then
              DATA_PARENT="$(dirname "${DATA_ROOT}")"
            else
              DATA_PARENT="checkout/data"
            fi
            mkdir -p checkout/website/src/data/site.d
            if [ -d "${DATA_PARENT}/shared/site.d" ]; then
              cp -r "${DATA_PARENT}/shared/site.d/." checkout/website/src/data/site.d/
            fi
            cp -r "${DATA_ROOT}/site.d/." checkout/website/src/data/site.d/
            cp "${DATA_ROOT}/site.yaml"   checkout/website/src/data/
          fi

      - name: Validate site data against contract
        run: |
          set -euo pipefail
          # Compiler-native sites keep their data in their own per-language
          # layers, so validation needs the same -site-data the build uses;
          # without it the compiler would validate the (absent) default
          # src/data/ tree and this gate would pass vacuously.
          #
          # The paths MUST be absolute. `go -C <compiler-dir> run` makes the
          # compiler process' CWD the compiler checkout, not the workspace, and
          # the compiler resolves -site-data entries relative to its own CWD
          # (sitegen.loadMultiDirSource -> os.ReadDir on each `|`-separated
          # part). A repo-relative value would resolve under checkout/compiler/
          # and die with "open src/data/common: no such file or directory".
          WEBSITE_ROOT="$GITHUB_WORKSPACE/checkout/website"
          SD_ARGS=()
          SD_COMMON="${{ matrix.deployment.site_data_common }}"
          SD_I18N="${{ matrix.deployment.site_data_i18n }}"
          if [[ -n "$SD_I18N" ]]; then
            SD_LANG_DIR="${SD_I18N%/}/${{ matrix.deployment.name }}"
            if [[ ! -d "${WEBSITE_ROOT}/${SD_LANG_DIR}" ]]; then
              echo "site_data.i18n is set but ${SD_LANG_DIR} is absent from the website repo" >&2
              exit 1
            fi
            if [[ -n "$SD_COMMON" ]]; then
              if [[ ! -d "${WEBSITE_ROOT}/${SD_COMMON%/}" ]]; then
                echo "site_data.common is set but ${SD_COMMON%/} is absent from the website repo" >&2
                exit 1
              fi
              SD_ARGS=("-site-data" "${WEBSITE_ROOT}/${SD_COMMON%/}|${WEBSITE_ROOT}/${SD_LANG_DIR}")
            else
              SD_ARGS=("-site-data" "${WEBSITE_ROOT}/${SD_LANG_DIR}")
            fi
          fi
          go -C "${{ steps.compiler.outputs.dir }}" run ./cmd/website-compiler \
            validate-site-data \
            -website-root "$WEBSITE_ROOT" \
            "${SD_ARGS[@]}"

  # ── build ─────────────────────────────────────────────────────────────────
  build:
    timeout-minutes: 30
    name: Build & Upload Artifact (${{ matrix.deployment.name }})
    needs: [config, validate]
    if: needs.config.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ matrix.deployment.github_env }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJson(needs.config.outputs.deployments_json) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ !env.ACT }} # harden-runner can't run under act/podman; runs on real GitHub only
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout data repo
        if: matrix.deployment.data_repo != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.deployment.data_repo }}
          ref: ${{ github.event.client_payload.data_sha || inputs.data_sha || matrix.deployment.data_ref }}
          path: checkout/data
          token: ${{ startsWith(matrix.deployment.data_repo, 'ffreis-org/') && secrets.FLEET_READ_TOKEN_ORG || secrets.FLEET_READ_TOKEN_FFREIS }}

      - name: Checkout website repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.deployment.website_repo }}
          ref: ${{ inputs.website_sha || matrix.deployment.website_ref }}
          path: checkout/website
          token: ${{ startsWith(matrix.deployment.website_repo, 'ffreis-org/') && secrets.FLEET_READ_TOKEN_ORG || secrets.FLEET_READ_TOKEN_FFREIS }}

      - name: Checkout compiler
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.deployment.compiler_repo }}
          ref: ${{ matrix.deployment.compiler_ref }}
          path: checkout/compiler
          token: ${{ startsWith(matrix.deployment.compiler_repo, 'ffreis-org/') && secrets.FLEET_READ_TOKEN_ORG || secrets.FLEET_READ_TOKEN_FFREIS }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: checkout/compiler/go.mod
          cache: true

      - name: Detect compiler layout
        id: compiler
        shell: bash
        run: |
          set -euo pipefail
          for root in checkout/compiler checkout/compiler/*/; do
            if [[ -f "${root}/go.mod" && -f "${root}/cmd/website-compiler/main.go" ]]; then
              echo "dir=${root}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Could not detect compiler layout under checkout/compiler" >&2; exit 1

      - name: Inject data into website
        if: matrix.deployment.data_repo != ''
        run: |
          set -euo pipefail
          SUBPATH="${{ matrix.deployment.data_subpath }}"
          SD_I18N="${{ matrix.deployment.site_data_i18n }}"
          if [[ -n "$SD_I18N" ]]; then
            # Compiler-native LAYERED archetype (ffreis-urbs). The data repo
            # carries the per-language layer tree itself -- i18n/<lang>/*.yaml,
            # with no site.d/ and no site.yaml -- and the website repo keeps the
            # common layer. So the injection is a directory swap, not a merge:
            # replace the website's layer dir wholesale, which is also what
            # makes a file DELETED in the data repo actually disappear from the
            # build instead of surviving as a stale copy.
            SRC="checkout/data${SUBPATH:+/${SUBPATH%/}}"
            DEST="checkout/website/${SD_I18N%/}"
            if [[ ! -d "$SRC" ]]; then
              echo "site_data.i18n is set, so the data repo must carry the language layers at '${SUBPATH:-<repo root>}' -- not found" >&2
              exit 1
            fi
            rm -rf "$DEST"
            mkdir -p "$(dirname "$DEST")"
            cp -r "$SRC" "$DEST"
          else
            # Split template+data archetype: the data repo carries site.d/ +
            # site.yaml, which are merged into the website's own src/data/.
            DATA_ROOT="checkout/data${SUBPATH:+/${SUBPATH%/}}"
            # shared/ lives alongside the language dirs; derive its parent from DATA_ROOT.
            # Works whether subpath is "en/" (root layout) or "data/en/" (nested layout).
            if [[ -n "$SUBPATH" ]]; then
              DATA_PARENT="$(dirname "${DATA_ROOT}")"
            else
              DATA_PARENT="checkout/data"
            fi
            mkdir -p checkout/website/src/data/site.d
            if [ -d "${DATA_PARENT}/shared/site.d" ]; then
              cp -r "${DATA_PARENT}/shared/site.d/." checkout/website/src/data/site.d/
            fi
            cp -r "${DATA_ROOT}/site.d/." checkout/website/src/data/site.d/
            cp "${DATA_ROOT}/site.yaml"   checkout/website/src/data/
          fi

      - name: Checkout shared JS repo
        if: matrix.deployment.shared_js_repo != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.deployment.shared_js_repo }}
          ref: ${{ matrix.deployment.shared_js_ref }}
          path: checkout/shared-js
          token: ${{ startsWith(matrix.deployment.shared_js_repo, 'ffreis-org/') && secrets.FLEET_READ_TOKEN_ORG || secrets.FLEET_READ_TOKEN_FFREIS }}

      - name: Inject shared JS into website
        if: matrix.deployment.shared_js_repo != ''
        env:
          SHARED_JS_FILES: ${{ matrix.deployment.shared_js_files }}
        run: |
          set -euo pipefail
          mkdir -p checkout/website/src/assets/js

          # Copying every *.js from the shared repo only works while every
          # consumer references every file. The compiler fails the build on an
          # unused local JS asset, so the moment the shared repo grows a second
          # file, any site that does not reference BOTH stops building —
          # a break in a repo whose own diff is empty.
          #
          # `sources.shared_js.files` in the inventory is the opt-in fix: list
          # the filenames this site actually loads. Omitted means "all", which
          # is what every existing entry gets.
          if [[ -n "$SHARED_JS_FILES" ]]; then
            for f in $SHARED_JS_FILES; do
              if [[ ! -f "checkout/shared-js/$f" ]]; then
                echo "::error::shared_js.files lists '$f', which does not exist in ${{ matrix.deployment.shared_js_repo }}" >&2
                exit 1
              fi
              cp "checkout/shared-js/$f" checkout/website/src/assets/js/
            done
            echo "injected shared JS (allow-list): $SHARED_JS_FILES"
          else
            cp checkout/shared-js/*.js checkout/website/src/assets/js/
            echo "injected shared JS (all):"
            find checkout/shared-js -maxdepth 1 -name '*.js' -printf '  %f\n' 
          fi

      - name: Checkout posts repo
        if: matrix.deployment.posts_repo != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.deployment.posts_repo }}
          ref: ${{ matrix.deployment.posts_ref }}
          path: checkout/posts
          token: ${{ startsWith(matrix.deployment.posts_repo, 'ffreis-org/') && secrets.FLEET_READ_TOKEN_ORG || secrets.FLEET_READ_TOKEN_FFREIS }}

      - name: Checkout projects repo
        if: matrix.deployment.projects_repo != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.deployment.projects_repo }}
          ref: ${{ matrix.deployment.projects_ref }}
          path: checkout/projects
          token: ${{ startsWith(matrix.deployment.projects_repo, 'ffreis-org/') && secrets.FLEET_READ_TOKEN_ORG || secrets.FLEET_READ_TOKEN_FFREIS }}

      - name: Checkout courses repo
        if: matrix.deployment.courses_repo != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.deployment.courses_repo }}
          ref: ${{ matrix.deployment.courses_ref }}
          path: checkout/courses
          token: ${{ startsWith(matrix.deployment.courses_repo, 'ffreis-org/') && secrets.FLEET_READ_TOKEN_ORG || secrets.FLEET_READ_TOKEN_FFREIS }}

      - name: Build static site
        run: |
          set -euo pipefail
          mkdir -p dist
          CONTENT_SOURCE="${{ matrix.deployment.content_source }}"
          POSTS_ARGS=()
          if [[ -n "${{ matrix.deployment.posts_repo }}" ]]; then
            if [[ "$CONTENT_SOURCE" == "mock" ]]; then
              POSTS_DIR="$GITHUB_WORKSPACE/checkout/posts/mock/posts"
            else
              POSTS_DIR="$GITHUB_WORKSPACE/checkout/posts/posts"
            fi
            if [[ -d "$POSTS_DIR" ]]; then
              POSTS_ARGS=("-posts-dir" "$POSTS_DIR")
            fi
          fi
          PROJECTS_ARGS=()
          if [[ -n "${{ matrix.deployment.projects_repo }}" ]]; then
            if [[ "$CONTENT_SOURCE" == "mock" ]]; then
              PROJECTS_FILE="$GITHUB_WORKSPACE/checkout/projects/mock/projects.yaml"
            else
              PROJECTS_FILE="$GITHUB_WORKSPACE/checkout/projects/projects.yaml"
            fi
            if [[ -f "$PROJECTS_FILE" ]]; then
              PROJECTS_ARGS=("-projects-file" "$PROJECTS_FILE")
            fi
          fi
          COURSES_ARGS=()
          if [[ -n "${{ matrix.deployment.courses_repo }}" ]]; then
            if [[ "$CONTENT_SOURCE" == "mock" ]]; then
              COURSES_FILE="$GITHUB_WORKSPACE/checkout/courses/mock/courses.yaml"
            else
              COURSES_FILE="$GITHUB_WORKSPACE/checkout/courses/courses.yaml"
            fi
            if [[ -f "$COURSES_FILE" ]]; then
              COURSES_ARGS=("-courses-file" "$COURSES_FILE")
            fi
          fi
          CONTENT_SOURCE_ARGS=()
          DEV_DATA_ARGS=()
          if [[ "$CONTENT_SOURCE" == "mock" ]]; then
            CONTENT_SOURCE_ARGS=("-content-source" "mock")
            DEV_DATA_ARGS=("-dev-data")
          fi
          # Compiler-native sites resolve their data from this repo's own layers.
          # The deployment name IS the language (deployments: en:, pt:), matching
          # the per-language loop in those repos' own Makefiles.
          #
          # Absolute paths are required: `go -C <compiler-dir> run` puts the
          # compiler's CWD in checkout/compiler, and -site-data parts are
          # resolved against that CWD, not against -website-root.
          WEBSITE_ROOT="$GITHUB_WORKSPACE/checkout/website"
          SITE_DATA_ARGS=()
          SD_COMMON="${{ matrix.deployment.site_data_common }}"
          SD_I18N="${{ matrix.deployment.site_data_i18n }}"
          if [[ -n "$SD_I18N" ]]; then
            SD_LANG_DIR="${SD_I18N%/}/${{ matrix.deployment.name }}"
            if [[ ! -d "${WEBSITE_ROOT}/${SD_LANG_DIR}" ]]; then
              echo "site_data.i18n is set but ${SD_LANG_DIR} is absent from the website repo" >&2
              exit 1
            fi
            if [[ -n "$SD_COMMON" ]]; then
              if [[ ! -d "${WEBSITE_ROOT}/${SD_COMMON%/}" ]]; then
                echo "site_data.common is set but ${SD_COMMON%/} is absent from the website repo" >&2
                exit 1
              fi
              SITE_DATA_ARGS=("-site-data" "${WEBSITE_ROOT}/${SD_COMMON%/}|${WEBSITE_ROOT}/${SD_LANG_DIR}")
            else
              SITE_DATA_ARGS=("-site-data" "${WEBSITE_ROOT}/${SD_LANG_DIR}")
            fi
          fi
          SIBLING_ARGS=()
          SIBLING_PREFIXES="${{ matrix.deployment.sibling_prefixes }}"
          if [[ -n "$SIBLING_PREFIXES" ]]; then
            SIBLING_ARGS=("-sibling-base-paths" "${SIBLING_PREFIXES// /,}")
          fi
          JS_INLINE_ARGS=()
          if [[ -n "${{ matrix.deployment.compiler_js_inline_threshold }}" ]]; then
            JS_INLINE_ARGS=("-js-inline-threshold" "${{ matrix.deployment.compiler_js_inline_threshold }}")
          fi
          JS_SHARED_INLINE_ARGS=()
          if [[ -n "${{ matrix.deployment.compiler_js_shared_inline_threshold }}" ]]; then
            JS_SHARED_INLINE_ARGS=("-js-shared-inline-threshold" "${{ matrix.deployment.compiler_js_shared_inline_threshold }}")
          fi
          RASTER_INLINE_ARGS=()
          if [[ -n "${{ matrix.deployment.compiler_raster_inline_threshold }}" ]]; then
            RASTER_INLINE_ARGS=("-raster-inline-threshold" "${{ matrix.deployment.compiler_raster_inline_threshold }}")
          fi
          CLEAN_URLS_ARGS=()
          if [[ "${{ matrix.deployment.compiler_clean_urls }}" == "true" ]]; then
            CLEAN_URLS_ARGS=("-clean-urls")
          fi
          EMBED_FONTS_ARGS=()
          if [[ "${{ matrix.deployment.compiler_embed_fonts }}" == "true" ]]; then
            EMBED_FONTS_ARGS=("-embed-fonts")
          fi
          INLINE_BODY_CSS_ARGS=()
          if [[ "${{ matrix.deployment.compiler_inline_body_css }}" == "true" ]]; then
            INLINE_BODY_CSS_ARGS=("-inline-body-css")
          fi
          ALLOW_BLANKET_ROBOTS_ARGS=()
          if [[ "${{ matrix.deployment.compiler_allow_blanket_robots_disallow }}" == "true" ]]; then
            ALLOW_BLANKET_ROBOTS_ARGS=("-allow-blanket-robots-disallow")
          fi
          DISABLE_SECTIONS_ARGS=()
          if [[ -n "${{ matrix.deployment.disable_sections }}" ]]; then
            DISABLE_SECTIONS_ARGS=("-disable-sections" "${{ matrix.deployment.disable_sections }}")
          fi
          TRACKER_ARGS=()
          if [[ "${{ matrix.deployment.tracker_enabled }}" == "true" ]]; then
            TRACKER_ARGS=(
              "-tracker-enabled"
              "-tracker-sdk-version" "${{ matrix.deployment.tracker_sdk_version }}"
              "-tracker-site-id"     "${{ matrix.deployment.tracker_site_id }}"
              "-tracker-endpoint"    "${{ matrix.deployment.tracker_endpoint }}"
            )
            if [[ -n "${{ matrix.deployment.tracker_cdn_base }}" ]]; then
              TRACKER_ARGS+=("-tracker-cdn-base" "${{ matrix.deployment.tracker_cdn_base }}")
            fi
          fi
          go -C "${{ steps.compiler.outputs.dir }}" run ./cmd/build-static \
            -website-root "$GITHUB_WORKSPACE/checkout/website" \
            -out "$GITHUB_WORKSPACE/dist" \
            "${CLEAN_URLS_ARGS[@]}" \
            "${SITE_DATA_ARGS[@]}" \
            "${CONTENT_SOURCE_ARGS[@]}" \
            "${DEV_DATA_ARGS[@]}" \
            "${POSTS_ARGS[@]}" \
            "${PROJECTS_ARGS[@]}" \
            "${COURSES_ARGS[@]}" \
            "${SIBLING_ARGS[@]}" \
            "${JS_INLINE_ARGS[@]}" \
            "${JS_SHARED_INLINE_ARGS[@]}" \
            "${RASTER_INLINE_ARGS[@]}" \
            "${EMBED_FONTS_ARGS[@]}" \
            "${INLINE_BODY_CSS_ARGS[@]}" \
            "${ALLOW_BLANKET_ROBOTS_ARGS[@]}" \
            "${DISABLE_SECTIONS_ARGS[@]}" \
            "${TRACKER_ARGS[@]}"

      - name: Emit content bundle
        if: matrix.deployment.emit_content_bundle == 'true'
        run: |
          set -euo pipefail
          # Capture the data repo's actual HEAD SHA so the bundle records the source revision.
          DATA_SHA="$(git -C "$GITHUB_WORKSPACE/checkout/data" rev-parse HEAD)"
          go -C "${{ steps.compiler.outputs.dir }}" run ./cmd/emit-content-bundle \
            -data-root "$GITHUB_WORKSPACE/checkout/data/data" \
            -langs "${{ matrix.deployment.name }}" \
            -out "$GITHUB_WORKSPACE/dist/content-bundle" \
            -source-sha "$DATA_SHA" \
            -generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # Writes dist/build-info.json — a small machine-readable deploy stamp
      # (which revision of the source repo is live, on which ref, built when)
      # that rides the existing S3 sync out to the site root as
      # /build-info.json. It is the fleet's one answer to "which build am I
      # looking at": any site's dev panel can fetch it, and nothing about it
      # is site-specific.
      #
      # Dev environments only. The file is served publicly from the site
      # root, so prod deployments deliberately get no stamp; a
      # `github_environment` ending in `-dev` is the same dev/prod
      # discriminator the promote job's smoke-test skip and the config job's
      # content_source guard already use. If a prod site ever needs a stamp,
      # promote this condition to an inventory-declared field rather than
      # dropping the gate.
      #
      # Every value arrives through `env:` so the script body carries no
      # `${{ }}` expression: that keeps it injection-safe AND runnable
      # outside Actions, which is exactly what tests/test_deploy_build_info.py
      # does to test this step as it actually ships.
      - name: Stamp build-info.json
        if: endsWith(matrix.deployment.github_env, '-dev')
        env:
          # The revision is read back from the checkout itself (same approach
          # as the content bundle above) rather than taken from the dispatch
          # payload, so the stamp can never disagree with the tree that was
          # actually compiled.
          WEBSITE_DIR:  ${{ github.workspace }}/checkout/website
          OUT_DIR:      ${{ github.workspace }}/dist
          WEBSITE_NAME: ${{ needs.config.outputs.website_name }}
          DEPLOYMENT:   ${{ matrix.deployment.name }}
          WEBSITE_REF:  ${{ inputs.website_sha || matrix.deployment.website_ref }}
        run: |
          set -euo pipefail
          BUILD_SHA="$(git -C "$WEBSITE_DIR" rev-parse HEAD)"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "$OUT_DIR"
          BUILD_SHA="$BUILD_SHA" DEPLOYED_AT="$DEPLOYED_AT" python3 - <<'PYEOF'
          import json, os

          info = {
              "sha":        os.environ["BUILD_SHA"],
              "branch":     os.environ["WEBSITE_REF"],
              "deployedAt": os.environ["DEPLOYED_AT"],
              "website":    os.environ["WEBSITE_NAME"],
              "deployment": os.environ["DEPLOYMENT"],
          }
          out = os.path.join(os.environ["OUT_DIR"], "build-info.json")
          with open(out, "w") as f:
              json.dump(info, f, indent=2, sort_keys=True)
              f.write("\n")
          print(f"wrote {out}: {info}")
          PYEOF

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ matrix.deployment.builds_region }}

      - name: Upload build artifact to staging bucket
        env:
          STAGING_PREFIX: ${{ matrix.deployment.staging_prefix }}
          BUILD_SHA:      ${{ github.event.client_payload.sha || github.sha }}
          BUILDS_BUCKET:  ${{ matrix.deployment.builds_bucket }}
          REGION:         ${{ matrix.deployment.builds_region }}
        run: |
          set -euo pipefail
          SHA7="${BUILD_SHA::7}"
          aws s3 sync dist/ "s3://${BUILDS_BUCKET}/${STAGING_PREFIX}/${SHA7}/" \
            --region "$REGION" --delete

  # ── promote ───────────────────────────────────────────────────────────────
  promote:
    timeout-minutes: 30
    name: Promote to Live (${{ matrix.deployment.name }})
    needs: [config, build]
    if: needs.config.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ matrix.deployment.github_env }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        deployment: ${{ fromJson(needs.config.outputs.deployments_json) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        if: ${{ !env.ACT }} # harden-runner can't run under act/podman; runs on real GitHub only
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ matrix.deployment.builds_region }}

      - name: Promote build to live bucket
        env:
          STAGING_PREFIX:   ${{ matrix.deployment.staging_prefix }}
          BUILD_SHA:        ${{ github.event.client_payload.sha || github.sha }}
          BUILDS_BUCKET:    ${{ matrix.deployment.builds_bucket }}
          LIVE_BUCKET:      ${{ secrets.S3_WEBSITE_BUCKET }}
          PUBLISH_PREFIX:   ${{ matrix.deployment.publish_prefix }}
          REGION:           ${{ matrix.deployment.builds_region }}
          SIBLING_PREFIXES: ${{ matrix.deployment.sibling_prefixes }}
        run: |
          set -euo pipefail
          SHA7="${BUILD_SHA::7}"
          SRC="s3://${BUILDS_BUCKET}/${STAGING_PREFIX}/${SHA7}/"
          if [[ -n "${PUBLISH_PREFIX}" ]]; then
            DEST="s3://${LIVE_BUCKET}/${PUBLISH_PREFIX%/}/"
          else
            DEST="s3://${LIVE_BUCKET}/"
          fi
          # When there are sibling deployments sharing the same bucket (e.g. PT
          # and EN on the same bucket, with PT at root and EN at en/), skip
          # --delete entirely for this deployment. aws s3 sync --delete with
          # --exclude does not reliably protect sibling prefixes in versioned
          # buckets, so we prefer to leave orphaned files rather than risk
          # wiping another language's content.
          if [[ -n "${SIBLING_PREFIXES:-}" ]]; then
            aws s3 sync "$SRC" "$DEST" --region "$REGION"
          else
            aws s3 sync "$SRC" "$DEST" --region "$REGION" --delete
          fi

      # Invalidation now runs BEFORE verification, and records the invalidation
      # id so the verification step can wait for it. The old order was
      # promote → smoke → invalidate, which meant the smoke test read the
      # edge while it was still serving the PREVIOUS deploy's cached object:
      # the one request in the whole pipeline that was guaranteed not to see
      # what had just been published.
      - name: Invalidate CloudFront cache
        id: invalidate
        env:
          CF_DISTRIBUTION_ID: ${{ secrets.CF_DISTRIBUTION_ID }}
          CF_PATHS:           ${{ matrix.deployment.cloudfront_paths }}
        run: |
          set -euo pipefail
          # CF_PATHS is space-joined; pass unquoted so each path is a separate
          # argument. scan-fix(shell:unquoted-glob): an unquoted "/*" (the
          # fleet default) also triggers pathname expansion against the
          # runner's real filesystem root (e.g. /home, /opt, /usr) instead of
          # the literal CloudFront path "/*" — set -f disables that expansion
          # while keeping the intended word-splitting.
          set -f
          # shellcheck disable=SC2086
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths $CF_PATHS \
            --query 'Invalidation.Id' --output text)
          set +f
          echo "Created invalidation ${INVALIDATION_ID} for paths: ${CF_PATHS}"
          echo "invalidation_id=${INVALIDATION_ID}" >> "$GITHUB_OUTPUT"

      # ── the real post-deploy gate ────────────────────────────────────────
      #
      # Asserts that the bytes the edge serves are the bytes this run just
      # promoted, by comparing a sha256 per HTML file against the staged
      # artifact. This replaces a status-code smoke test that could not fail
      # on the thing that actually goes wrong.
      #
      # On 2026-10-18 forma.ffreis.com/login.html was found serving markup a
      # fix had removed six days earlier, with every deploy in between
      # reporting success. The old gate missed it three independent ways:
      #
      #   1. it asserted only `[[ "$STATUS" =~ ^[23] ]]`, and stale content
      #      returns 200;
      #   2. it ran BEFORE the invalidation, so it read the pre-deploy cached
      #      object by construction;
      #   3. `smoke_paths` defaulted to ["/"], so a deployment published under
      #      `prefix: en/` had its gate pointed at the bucket ROOT — a path
      #      that deployment does not maintain at all.
      #
      # Every value arrives through `env:` so the body carries no `${{ }}`
      # expression: that is both the injection-safe shape and what makes it
      # runnable outside Actions, which is how
      # tests/test_verify_live_content.py tests this step as it ships —
      # including the case that matters, a 200 serving last week's bytes.
      - name: Verify live content matches the promoted artifact
        env:
          BUILDS_BUCKET:            ${{ matrix.deployment.builds_bucket }}
          BUILD_SHA:                ${{ github.event.client_payload.sha || github.sha }}
          CF_DISTRIBUTION_ID:       ${{ secrets.CF_DISTRIBUTION_ID }}
          CF_INVALIDATION_ID:       ${{ steps.invalidate.outputs.invalidation_id }}
          # Optional per-environment secret. *.ffreis.com dev sites sit behind a
          # CloudFront viewer-request gate that compares a `dev_access` cookie
          # against the distribution's secret; without it the edge answers 403
          # with an empty body. An unset secret resolves to "" — the body then
          # reports a loud SKIP rather than a silent pass.
          DEV_ACCESS_TOKEN:         ${{ secrets.DEV_ACCESS_TOKEN }}
          GITHUB_ENV_NAME:          ${{ matrix.deployment.github_env }}
          PUBLISH_PREFIX:           ${{ matrix.deployment.publish_prefix }}
          REGION:                   ${{ matrix.deployment.builds_region }}
          SKIP_SMOKE:               ${{ matrix.deployment.skip_smoke }}
          SMOKE_PATHS:              ${{ matrix.deployment.smoke_paths }}
          STAGING_PREFIX:           ${{ matrix.deployment.staging_prefix }}
          # Bound the edge requests a promote job makes. The cap keeps the
          # deployment's entry point and error page first, then walks the rest
          # of the artifact in sorted order.
          VERIFY_MAX_FILES:         '40'
          # The invalidation wait below is the primary synchronisation. This is
          # the fallback for a role without cloudfront:GetInvalidation: re-check
          # only the still-mismatching paths until the deadline, so ordinary
          # propagation lag cannot red a deploy while a genuinely unmaintained
          # object — never invalidated, as in the incident — still fails.
          VERIFY_DEADLINE_SECONDS:  '120'
          VERIFY_RETRY_SLEEP:       '15'
        run: |
          set -euo pipefail

          summary() { cat >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }

          # ── 0. inventory opt-out ──────────────────────────────────────────
          # publish.skip_smoke is for sites whose edge the runner genuinely
          # cannot reach (WAF IP allowlist on prod, e.g. dashboard.ffreis.com).
          # It is now a loud warning: it disables the fleet's only check that
          # the deploy changed what the site serves.
          if [[ "$SKIP_SMOKE" == "true" ]]; then
            echo "::warning title=Live content NOT verified::inventory publish.skip_smoke=true for ${GITHUB_ENV_NAME}; the live site was never compared against the promoted artifact."
            # shellcheck disable=SC2016  # backticks are markdown code spans, not command substitution
            {
              printf '### Live content verification: SKIPPED\n\n'
              printf '`publish.skip_smoke: true` in inventory for `%s`. The promoted artifact was **not** compared against what the edge serves.\n' "$GITHUB_ENV_NAME"
            } | summary
            exit 0
          fi

          # ── 1. wait for the invalidation this run created ─────────────────
          if [[ -z "$CF_INVALIDATION_ID" ]]; then
            echo "No invalidation id was captured from the previous step — refusing to verify a possibly-cached edge." >&2
            exit 1
          fi
          echo "Waiting for CloudFront invalidation ${CF_INVALIDATION_ID} to complete ..."
          if aws cloudfront wait invalidation-completed \
               --distribution-id "$CF_DISTRIBUTION_ID" \
               --id "$CF_INVALIDATION_ID"; then
            echo "Invalidation ${CF_INVALIDATION_ID} completed; the edge is clear."
          else
            echo "::warning title=Could not wait on the invalidation::aws cloudfront wait invalidation-completed failed for ${CF_INVALIDATION_ID} (the deploy role may lack cloudfront:GetInvalidation). Falling back to re-checking mismatches until the ${VERIFY_DEADLINE_SECONDS}s deadline."
          fi

          # ── 2. resolve the public domain ──────────────────────────────────
          # First non-www alias, or the CloudFront *.cloudfront.net domain.
          ALIASES=$(aws cloudfront get-distribution \
            --id "$CF_DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.Aliases.Items' \
            --output json 2>/dev/null || echo "null")
          if [[ "$ALIASES" == "null" || "$ALIASES" == "[]" ]]; then
            DOMAIN=$(aws cloudfront get-distribution \
              --id "$CF_DISTRIBUTION_ID" \
              --query 'Distribution.DomainName' --output text)
          else
            DOMAIN=$(ALIASES_JSON="$ALIASES" python3 -c "
          import json, os
          aliases = json.loads(os.environ['ALIASES_JSON'])
          print(next((a for a in aliases if not a.startswith('www.')), aliases[0]))
          ")
          fi
          LIVE_URL="https://${DOMAIN}"

          # The URL space this deployment actually maintains. A deployment with
          # `prefix: en/` is reachable at /en/... and nowhere else; verifying it
          # at "/" tests an unrelated, unmanaged part of the bucket.
          if [[ -n "$PUBLISH_PREFIX" ]]; then
            URL_PREFIX="/${PUBLISH_PREFIX#/}"
            URL_PREFIX="${URL_PREFIX%/}/"
          else
            URL_PREFIX="/"
          fi

          # ── 3. pull down the artifact that was just promoted ──────────────
          # This is the same object set the promote step synced to the live
          # bucket, read from the staging bucket at the same immutable
          # <staging-prefix>/<sha7>/ key — so "what we expect to be live" is
          # never a reconstruction, it is the artifact itself.
          SHA7="${BUILD_SHA::7}"
          SRC="s3://${BUILDS_BUCKET}/${STAGING_PREFIX}/${SHA7}/"
          STAGED=$(mktemp -d)
          aws s3 cp "$SRC" "$STAGED/" --recursive --region "$REGION" \
            --exclude "*" --include "*.html" --only-show-errors

          mapfile -t STAGED_HTML < <(cd "$STAGED" && find . -type f -name '*.html' -printf '%P\n' | LC_ALL=C sort)
          if [[ "${#STAGED_HTML[@]}" -eq 0 ]]; then
            echo "The promoted artifact at ${SRC} contains no HTML — nothing to verify, which is itself a broken deploy." >&2
            exit 1
          fi

          # Entry point and error page first: those are the two objects a
          # distribution resolves on its own (DefaultRootObject /
          # CustomErrorResponses), so they must never fall off the end of the cap.
          ORDERED=()
          for want in "index.html" "404.html"; do
            for f in "${STAGED_HTML[@]}"; do
              [[ "$f" == "$want" ]] && ORDERED+=("$f")
            done
          done
          for f in "${STAGED_HTML[@]}"; do
            skip=
            for already in ${ORDERED[@]+"${ORDERED[@]}"}; do
              [[ "$f" == "$already" ]] && skip=1 && break
            done
            [[ -n "$skip" ]] || ORDERED+=("$f")
          done

          # ── 4. how to reach a gated site ──────────────────────────────────
          CURL_AUTH=()
          if [[ -n "$DEV_ACCESS_TOKEN" ]]; then
            CURL_AUTH=(--cookie "dev_access=${DEV_ACCESS_TOKEN}")
            echo "Using the dev_access cookie from the DEV_ACCESS_TOKEN secret."
          fi

          # --location: a clean-URL site may 301 /x/index.html → /x/. Following
          # it is safe because the sha256 below, not the status, is the
          # assertion — the redirect target must still serve the promoted bytes.
          # Accept-Encoding: identity so CloudFront compression cannot change
          # the bytes we hash; no-cache so we measure the edge, not a proxy.
          fetch() {
            curl -s -o "$2" -w '%{http_code}' \
              --max-time 30 --connect-timeout 10 --location \
              -H 'Accept-Encoding: identity' \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              ${CURL_AUTH[@]+"${CURL_AUTH[@]}"} \
              "$1" || echo "000"
          }

          # A viewer-request gate rejects BEFORE the origin, so CustomErrorResponses
          # never rewrite its answer: "403 with a zero-length body" is a reliable
          # signature for "gated", distinct from a missing object (which reaches
          # the origin and comes back as the /404.html error page, with a body).
          PROBE_BODY=$(mktemp)
          PROBE_URL="${LIVE_URL}${URL_PREFIX}${ORDERED[0]}"
          PROBE_STATUS=$(fetch "$PROBE_URL" "$PROBE_BODY")
          PROBE_SIZE=$(stat -c %s "$PROBE_BODY")
          if [[ "$PROBE_STATUS" == "403" && "$PROBE_SIZE" -eq 0 ]]; then
            if [[ -n "$DEV_ACCESS_TOKEN" ]]; then
              echo "::error title=dev_access token rejected::${PROBE_URL} answered 403 with an empty body even though DEV_ACCESS_TOKEN was supplied — the token does not match this distribution's gate secret, so live content could not be verified."
              exit 1
            fi
            echo "::warning title=Live content NOT verified (site is gated)::${PROBE_URL} answered 403 with an empty body: this distribution's viewer-request gate rejected an unauthenticated request and no DEV_ACCESS_TOKEN secret is set on environment ${GITHUB_ENV_NAME}. The promoted artifact was NOT compared against what the edge serves."
            # shellcheck disable=SC2016  # backticks are markdown code spans, not command substitution
            {
              printf '### Live content verification: SKIPPED (gated)\n\n'
              printf '`%s` answered **403 with an empty body** — the CloudFront viewer-request gate rejected an unauthenticated request.\n\n' "$PROBE_URL"
              printf 'No `DEV_ACCESS_TOKEN` secret is configured on environment `%s`, so the promoted artifact was **not** compared against what the edge serves.\n\n' "$GITHUB_ENV_NAME"
              printf 'Add a `DEV_ACCESS_TOKEN` secret holding the `dev_access` value for this distribution to that GitHub environment to turn this into a real check.\n'
            } | summary
            exit 0
          fi

          # ── 5. compare the edge against the artifact, byte for byte ───────
          echo "Verifying ${LIVE_URL}${URL_PREFIX} against ${SRC} (${#STAGED_HTML[@]} HTML file(s), cap ${VERIFY_MAX_FILES}) ..."
          PENDING=("${ORDERED[@]:0:VERIFY_MAX_FILES}")
          CHECKED="${#PENDING[@]}"
          DEADLINE=$(( $(date +%s) + VERIFY_DEADLINE_SECONDS ))
          declare -A REASON=()
          FAILED=()
          ATTEMPT=0
          while :; do
            ATTEMPT=$(( ATTEMPT + 1 ))
            FAILED=()
            for rel in "${PENDING[@]}"; do
              URL="${LIVE_URL}${URL_PREFIX}${rel}"
              BODY=$(mktemp)
              STATUS=$(fetch "$URL" "$BODY")
              WANT=$(sha256sum "${STAGED}/${rel}" | cut -d' ' -f1)
              GOT=$(sha256sum "$BODY" | cut -d' ' -f1)
              rm -f "$BODY"
              if [[ ! "$STATUS" =~ ^2 ]]; then
                REASON["$rel"]="HTTP ${STATUS} (unreachable)"
                FAILED+=("$rel")
              elif [[ "$WANT" != "$GOT" ]]; then
                # The incident's exact signature: a 200 whose bytes are not the
                # ones just promoted.
                REASON["$rel"]="HTTP ${STATUS} but STALE — artifact sha256 ${WANT}, live sha256 ${GOT}"
                FAILED+=("$rel")
              else
                echo "  ok      ${URL_PREFIX}${rel} → ${STATUS}, sha256 matches the promoted artifact"
              fi
            done
            [[ "${#FAILED[@]}" -eq 0 ]] && break
            [[ "$(date +%s)" -ge "$DEADLINE" ]] && break
            echo "  ...     ${#FAILED[@]} path(s) not yet serving the promoted bytes; re-checking in ${VERIFY_RETRY_SLEEP}s (attempt ${ATTEMPT})"
            sleep "$VERIFY_RETRY_SLEEP"
            PENDING=("${FAILED[@]}")
          done

          # ── 6. declared smoke_paths, as URL shapes ────────────────────────
          # The artifact walk above covers every page by its literal key. These
          # are the URL forms the inventory declares (clean URLs, redirects),
          # which exercise edge behaviour no object key does.
          for path in $SMOKE_PATHS; do
            BODY=$(mktemp)
            STATUS=$(fetch "${LIVE_URL}${path}" "$BODY")
            rm -f "$BODY"
            if [[ "$STATUS" =~ ^2 ]]; then
              echo "  ok      ${path} → ${STATUS} (declared smoke path)"
            else
              REASON["$path"]="HTTP ${STATUS} (declared smoke path unreachable)"
              FAILED+=("$path")
            fi
          done

          if [[ "${#FAILED[@]}" -gt 0 ]]; then
            echo "" >&2
            echo "Live verification FAILED — the edge is not serving the artifact this run promoted:" >&2
            SUMMARY_MD=$(mktemp)
            {
              echo "### Live content verification: FAILED"
              echo ""
              echo "\`${LIVE_URL}${URL_PREFIX}\` is not serving the artifact promoted by this run (\`${SRC}\`)."
              echo ""
              echo "| path | finding |"
              echo "| --- | --- |"
            } > "$SUMMARY_MD"
            for rel in "${FAILED[@]}"; do
              echo "  FAIL    ${rel} → ${REASON[$rel]}" >&2
              echo "| \`${rel}\` | ${REASON[$rel]} |" >> "$SUMMARY_MD"
            done
            summary < "$SUMMARY_MD"
            # Not "N of CHECKED": FAILED can also carry declared smoke paths,
            # which are not part of the artifact count.
            echo "::error title=Live content does not match the promoted artifact::${#FAILED[@]} path(s) are stale or unreachable at ${LIVE_URL}${URL_PREFIX} after invalidation ${CF_INVALIDATION_ID} completed (${CHECKED} artifact file(s) plus the declared smoke paths were checked)."
            exit 1
          fi

          echo "All ${CHECKED} verified path(s) serve exactly the promoted artifact."
          # shellcheck disable=SC2016  # backticks are markdown code spans, not command substitution
          {
            printf '### Live content verification: PASSED\n\n'
            printf '`%s` of `%s` HTML file(s) under `%s` match the promoted artifact byte for byte (sha256), after invalidation `%s` completed.\n' \
              "$CHECKED" "${#STAGED_HTML[@]}" "$URL_PREFIX" "$CF_INVALIDATION_ID"
          } | summary

      # ── orphan scan ──────────────────────────────────────────────────────
      #
      # An object in the publish bucket outside every prefix this site declares
      # is maintained by nothing: no sync overwrites it, no invalidation clears
      # it, so it serves whatever bytes it was last given, forever. That is the
      # state forma-dev's bucket root was in — 60 keys from one 2026-10-12
      # deploy, while `en/` and `pt/` were kept current around them.
      #
      # Why this warns rather than fails, except for one case:
      #
      #   * The root of a prefixed site is NOT garbage. A distribution resolves
      #     `DefaultRootObject` and every `CustomErrorResponses` page at the
      #     bucket ROOT, so those keys must exist outside all deployment
      #     prefixes. "orphan ⇒ fail" would red every prefixed site forever and
      #     "orphan ⇒ delete" would break the entry point and the error page.
      #     Those keys are therefore read from the live distribution and
      #     reported as `held`, never as a problem.
      #   * A bucket may also hold deliberate extras — a `js/` prefix shared
      #     between languages, a verification file. Failing on those would train
      #     whoever reads the result to ignore it.
      #
      # The one case that DOES fail is a SHADOW orphan: an unmanaged key whose
      # same relative path also exists inside a declared prefix. `login.html`
      # existing at both `/login.html` (unmanaged, frozen) and `/en/login.html`
      # (maintained, current) is not an extra file — it is a second, stale copy
      # of a live page, reachable by URL, which is exactly the incident. It
      # cannot fire on a legitimately-placed root file that has no managed
      # counterpart, and it never fires on the distribution's own held keys.
      - name: Scan publish bucket for unmanaged (orphan) objects
        env:
          CF_DISTRIBUTION_ID: ${{ secrets.CF_DISTRIBUTION_ID }}
          LIVE_BUCKET:        ${{ secrets.S3_WEBSITE_BUCKET }}
          MANAGED_PREFIXES:   ${{ matrix.deployment.managed_prefixes }}
          PUBLISH_REGION:     ${{ matrix.deployment.publish_region }}
          ROOT_IS_MANAGED:    ${{ matrix.deployment.root_is_managed }}
          # Escalation switch, deliberately OFF. 9 of the 13 website entries in
          # the inventory publish only under prefixes today, and several of those
          # buckets still hold objects from a pre-prefix layout — so turning this
          # on now would red much of the fleet, prod included, for a condition no
          # deploy can remediate (promote skips `--delete` whenever siblings share
          # a bucket, precisely so one language cannot wipe another's content).
          # Flip it to 'true' per-site once that bucket's root has been cleaned
          # up, and the scan becomes a gate that keeps it clean.
          FAIL_ON_DIVERGENT_SHADOW: 'false'
        run: |
          set -euo pipefail

          # A deployment publishing at the bucket root claims every key, so
          # there is nothing outside the managed space to find.
          if [[ "$ROOT_IS_MANAGED" == "true" || -z "$MANAGED_PREFIXES" ]]; then
            echo "This site publishes at the bucket root — no key lies outside a declared deployment prefix."
            exit 0
          fi

          # Read the keys the distribution resolves for itself. get-distribution
          # is the same call the verification step already makes, so this adds no
          # new IAM action.
          DIST_JSON=$(aws cloudfront get-distribution --id "$CF_DISTRIBUTION_ID" --output json)
          # ETag comes along for free here and is the content discriminator below.
          BUCKET_OBJECTS=$(aws s3api list-objects-v2 \
            --bucket "$LIVE_BUCKET" --region "$PUBLISH_REGION" \
            --query 'Contents[].[Key,ETag,LastModified]' --output json)

          BUCKET_OBJECTS="$BUCKET_OBJECTS" DIST_JSON="$DIST_JSON" python3 - <<'PYEOF'
          import json, os, sys

          rows_in = json.loads(os.environ["BUCKET_OBJECTS"] or "null") or []
          dist = json.loads(os.environ["DIST_JSON"])["Distribution"]["DistributionConfig"]
          prefixes = sorted({p for p in os.environ["MANAGED_PREFIXES"].split() if p})
          bucket = os.environ["LIVE_BUCKET"]
          fail_on_divergent = os.environ["FAIL_ON_DIVERGENT_SHADOW"] == "true"

          etag = {k: (e or "").strip('"') for k, e, _ in rows_in}
          modified = {k: m for k, _, m in rows_in}
          keys = [k for k, _, _ in rows_in]
          keyset = set(keys)

          # Keys the distribution itself resolves at the bucket ROOT, read from
          # the live config rather than hardcoded. These MUST exist outside every
          # deployment prefix: a prefixed site's DefaultRootObject and its
          # CustomErrorResponses pages are root objects by definition (on
          # ffreis-urbs-dev the root index.html is Terraform-owned and serves as
          # the distribution's error document). They are held, never a finding,
          # and never a deletion candidate.
          held = set()
          root_object = (dist.get("DefaultRootObject") or "").lstrip("/")
          if root_object:
              held.add(root_object)
          for err in (dist.get("CustomErrorResponses") or {}).get("Items") or []:
              page = (err.get("ResponsePagePath") or "").lstrip("/")
              if page:
                  held.add(page)

          orphans = [
              k for k in keys
              if not k.endswith("/") and not any(k.startswith(p) for p in prefixes)
          ]

          # A SHADOW orphan is the same relative path served twice: once from a
          # maintained prefix, once from the unmaintained root. Compare ETags —
          # for these single-part HTML uploads an ETag is the content MD5, so a
          # differing ETag means the two copies genuinely serve different bytes
          # and the unmanaged one is stale. An ETag containing "-" is a multipart
          # upload whose ETag is not a content hash; those are reported as
          # "unknown" rather than guessed at.
          divergent, identical, unknown, other = [], [], [], []
          for k in orphans:
              if k in held:
                  continue
              twins = [p for p in prefixes if f"{p}{k}" in keyset]
              if not twins:
                  other.append(k)
                  continue
              mine = etag.get(k, "")
              theirs = [etag.get(f"{p}{k}", "") for p in twins]
              if "-" in mine or any("-" in t for t in theirs):
                  unknown.append((k, twins))
              elif all(mine == t for t in theirs):
                  identical.append((k, twins))
              else:
                  divergent.append((k, twins))

          held_present = sorted(held & keyset)
          counts = [
              f"Declared deployment prefixes: {' '.join(prefixes)}",
              f"Keys outside every declared prefix: {len(orphans)}",
              f"  held by the distribution (DefaultRootObject / error pages): {len(held_present)}",
              f"  shadow copies serving DIFFERENT bytes than the maintained page: {len(divergent)}",
              f"  shadow copies byte-identical to the maintained page: {len(identical)}",
              f"  shadow copies whose ETag cannot be compared (multipart): {len(unknown)}",
              f"  other unmanaged keys (no maintained counterpart): {len(other)}",
          ]
          print(f"Publish bucket: s3://{bucket}")
          for line in counts:
              print(line)
          for k in held_present:
              print(f"  held      {k}  (resolved by the distribution itself; must stay)")
          for k in sorted(other):
              print(f"  unmanaged {k}  (maintained by no deployment; serves its current bytes indefinitely)")
          for k, twins in sorted(identical):
              print(f"  dup       {k}  (byte-identical to {' '.join(twins)}{k})")
          for k, twins in sorted(unknown):
              print(f"  unknown   {k}  (also under {' '.join(twins)}; multipart ETag, not comparable)")
          for k, twins in sorted(divergent):
              print(
                  f"  STALE     {k}  (last modified {modified.get(k)}) serves different bytes than "
                  f"{' '.join(f'{p}{k}' for p in twins)} — a second, unmaintained copy of a live page"
              )

          md = ["### Unmanaged objects in the publish bucket", "", *(f"- {line}" for line in counts)]
          if divergent:
              md += [
                  "",
                  "#### Stale shadow copies",
                  "",
                  "Each key below is a second copy of a page that **is** kept current under a declared "
                  "prefix, but lies outside every prefix itself — so no sync overwrites it and no "
                  "invalidation clears it. It serves different bytes than the maintained copy, which means "
                  "it is serving stale markup at a live URL right now.",
                  "",
                  "| unmanaged key | last modified | maintained copy |",
                  "| --- | --- | --- |",
                  *(
                      f"| `{k}` | {modified.get(k)} | {' '.join(f'`{p}{k}`' for p in twins)} |"
                      for k, twins in sorted(divergent)
                  ),
                  "",
                  "Remediation is one of: delete these keys, or declare a deployment that publishes to the "
                  "bucket root so they are maintained. Do **not** blanket-delete the root — the keys listed "
                  "as `held` above are the distribution's own DefaultRootObject and error pages.",
              ]
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write("\n".join(md) + "\n")

          if other or identical or unknown:
              print(
                  "::warning title=Unmanaged objects in the publish bucket::"
                  f"{len(other) + len(identical) + len(unknown)} key(s) in s3://{bucket} lie outside every "
                  f"declared deployment prefix ({' '.join(prefixes)}). Nothing syncs or invalidates them, so "
                  "they will serve their current bytes indefinitely."
              )
          if divergent:
              # Loud, specific, and attached to the run — but not fatal by
              # default. See FAIL_ON_DIVERGENT_SHADOW above for why.
              print(
                  "::error title=Stale shadow copies serving a live URL::"
                  f"{len(divergent)} key(s) in s3://{bucket} duplicate a page kept current under a declared "
                  f"prefix ({' '.join(prefixes)}) but are maintained by no deployment, and serve DIFFERENT "
                  f"bytes: {', '.join(k for k, _ in sorted(divergent))}. "
                  "Delete them, or give the bucket root a deployment."
              )
              if fail_on_divergent:
                  sys.exit(1)
          PYEOF
